name: Build APK

# کاتی جێبەجێبوون: هەر push/PR بۆ main، یان بە دەست لە تابی Actions
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # پرۆژەکە gradlew (wrapper) نییە، لەبەرئەوە ئەم ئاکشنە خۆی وەشانی
        # Gradle-ی گونجاو دادەبەزێنێت بەپێی gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bizane-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
